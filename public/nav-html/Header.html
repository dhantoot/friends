<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetrical Header - Updated Viewport</title>
    <style>
        :root {
            --card-width: 272px;
            --card-height: 325px;
            --milky-white: #FDFDFD;
            --milky-cream: #F5F5F0;
            --milky-beige: #F0EDE5;
            --accent-text: #392B28;
            --bg-dark: #0A0A0C;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            margin: 0;
            font-family: 'Outfit', 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }

        .preview-stage {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0A0A0C 100%);
        }

        .header-wrapper {
            position: relative;
            width: var(--card-width);
            height: var(--card-height);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
        }

        .header-wrapper:hover {
            transform: translateY(8px) scale(1.02);
        }

        .header-div {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                rgba(253, 253, 253, 0.98) 0%, 
                rgba(245, 245, 240, 0.95) 50%, 
                rgba(240, 237, 229, 0.92) 100%
            );
            position: relative;
            
            /* Symmetrical Header path updated from the latest reference SVG */
            clip-path: path('M 68 1 H 17 C 7 1, 1 12, 1 19 V 306 C 1 319, 10 324, 14 324 H 95 C 109 322, 112 314, 124 304 C 134 296, 138 296, 148 304 C 160 314, 163 322, 177 324 H 258 C 262 324, 271 319, 271 306 V 19 C 271 12, 265 1, 255 1 H 204 C 200 1, 193 4, 191 11 C 189 18, 183 21, 181 21.5 H 91 C 88 21, 82 18, 81 11 C 79 4, 72 1, 68 1 Z');
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 0.8px solid rgba(57, 43, 40, 0.15);
            backdrop-filter: blur(10px);
        }

        .header-div::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 40%);
            pointer-events: none;
        }

        .content {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        .tag {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: rgba(57, 43, 40, 0.4);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .title {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent-text);
            letter-spacing: -1px;
            line-height: 1.2;
        }

        .accent-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #392B28;
            border-radius: 50%;
            bottom: 40px;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div class="preview-stage">
        <div class="header-wrapper">
            <div class="header-div">
                <div class="content">
                    <div class="tag">Header Refined</div>
                    <div class="title">SYMMETRICAL<br>V4</div>
                </div>
                <div class="accent-dot"></div>
            </div>
        </div>
    </div>

</body>
</html>
