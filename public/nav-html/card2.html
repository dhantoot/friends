<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetrical Card 2 - Updated</title>
    <style>
        :root {
            --card-width: 366px;
            --card-height: 170px;
            --primary-glow: rgba(0, 242, 219, 0.6);
            --bg-color: #050507;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        .card-wrapper {
            position: relative;
            width: var(--card-width);
            height: var(--card-height);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        .card-wrapper:hover {
            transform: translateY(-12px) scale(1.03);
        }

        /* The Main Card Div using SVG background */
        .card-div {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #16161d 0%, #1c1c24 100%);
            position: relative;
            
            /* Symmetrical complex path extracted from the updated card2.svg */
            clip-path: path('M 25 1 H 123 C 133 1, 135 10, 140 15 C 158 40, 208 40, 226 15 C 231 10, 233 1, 243 1 H 341 C 355 1, 365 11, 365 25 V 145 C 365 159, 355 169, 341 169 H 250 C 240 169, 236 159, 236 143 C 236 127, 224 122, 216 122 H 150 C 142 122, 130 127, 130 143 C 130 159, 126 169, 116 169 H 25 C 11 169, 1 159, 1 145 V 25 C 1 11, 11 1, 25 1 Z');
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            z-index: 2;
        }

        .card-div::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }

        .card-wrapper:hover .card-div::after {
            left: 100%;
        }

        /* Ambient Glow Effect */
        .glow {
            position: absolute;
            inset: -30px;
            background: radial-gradient(circle at center, var(--primary-glow), transparent 70%);
            filter: blur(40px);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
            pointer-events: none;
            /* Match the shape for the glow as well */
            clip-path: path('M 25 1 H 123 C 133 1, 135 10, 140 15 C 158 40, 208 40, 226 15 C 231 10, 233 1, 243 1 H 341 C 355 1, 365 11, 365 25 V 145 C 365 159, 355 169, 341 169 H 250 C 240 169, 236 159, 236 143 C 236 127, 224 122, 216 122 H 150 C 142 122, 130 127, 130 143 C 130 159, 126 169, 116 169 H 25 C 11 169, 1 159, 1 145 V 25 C 1 11, 11 1, 25 1 Z');
        }

        .card-wrapper:hover .glow {
            opacity: 0.4;
        }

        .inner-border {
            position: absolute;
            inset: 2px;
            clip-path: inherit;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
            opacity: 0.5;
        }

        .content {
            text-align: center;
            z-index: 3;
        }

        .tag {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #00f2db;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .label {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <div class="glow"></div>
        <div class="card-div">
            <div class="inner-border"></div>
            <div class="content">
                <div class="tag">System Updated</div>
                <div class="label">Symmetrical V2</div>
            </div>
        </div>
    </div>

</body>
</html>
